name: Retrom Web Quality
on:
  pull_request:
    branches: [retrom/6.0.8]
  push:
    branches: [retrom/6.0.8]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
      - run: python3 -B -m unittest discover -s .github/rpg-runtime -p 'test_*.py'
      - name: Verify deterministic fork build
        run: |
          mkdir "$RUNNER_TEMP/core-a" "$RUNNER_TEMP/core-b"
          bash .github/rpg-runtime/build-candidate.sh "$RUNNER_TEMP/core-a"
          bash .github/rpg-runtime/build-candidate.sh "$RUNNER_TEMP/core-b"
          diff -r "$RUNNER_TEMP/core-a" "$RUNNER_TEMP/core-b"
